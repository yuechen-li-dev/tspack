name: setup-tspack
description: Install TSPack from GitHub Releases and add it to PATH.
inputs:
  version:
    description: "TSPack version to install. Use 'latest' or a tag like v0.1.8."
    required: false
    default: "latest"
  repo:
    description: "Repository to download TSPack releases from."
    required: false
    default: "yuechen-li-dev/tspack"
  github-token:
    description: "GitHub token for API requests, useful for rate limits or private forks."
    required: false
  install-dir:
    description: "Directory to install tspack into. Defaults to runner temp."
    required: false
  check:
    description: "Run 'tspack --help' after installation."
    required: false
    default: "true"
  version-file:
    description: "Project-relative minimum-version file checked after resolving the requested release. Defaults to .tspack-version."
    required: false
    default: ".tspack-version"
outputs:
  version:
    description: "Installed TSPack release tag."
  path:
    description: "Installed tspack binary path."
runs:
  using: node20
  main: index.js
