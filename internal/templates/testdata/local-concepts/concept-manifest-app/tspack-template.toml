format = 1
name = "concept-manifest-app"
description = "Local app using concept-rendered manifest"
kind = "app"
concepts = [
  "react.app",
  "browser.spa",
  "vite.app",
  "typescript.app",
  "tspack.workspace",
  "tspack.manifestBoundary",
  "tspack.updatePolicy",
  "tspack.securityPolicy",
  "my-company.design-system",
]

[generation]
manifest = "concept"

[variables.projectName]
default = "local-concept-app"

[variables.packageName]
default = "local-concept-app"

[variables.runtime]
default = "nodejs"
allowed = ["nodejs", "bun", "deno"]


[[files]]
from = "files/package.json.tmpl"
to = "package.json"

[[files]]
from = "files/tsconfig.tspack.json"
to = "tsconfig.tspack.json"

[[files]]
from = "files/tsconfig.json"
to = "tsconfig.json"

[[files]]
from = "files/tspack-types/tspack-manifest.d.ts"
to = ".tspack/types/tspack-manifest.d.ts"

[[files]]
from = "files/tspack-env.d.ts"
to = "tspack-env.d.ts"

[[files]]
from = "files/biome.json"
to = "biome.json"

[[files]]
from = "files/vite.config.ts"
to = "vite.config.ts"

[[files]]
from = "files/index.html.tmpl"
to = "index.html"

[[files]]
from = "files/src/main.tsx"
to = "src/main.tsx"

[[files]]
from = "files/src/App.tsx"
to = "src/App.tsx"

[[files]]
from = "files/src/ui.ts"
to = "src/ui.ts"

[[files]]
from = "files/src/style.css"
to = "src/style.css"

[[files]]
from = "files/README.md.tmpl"
to = "README.md"

[[localConcepts]]
name = "my-company.design-system"
path = "concepts/design-system.toml"
