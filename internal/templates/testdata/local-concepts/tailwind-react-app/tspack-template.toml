format = 1
name = "tailwind-react-app"
description = "Local React app using a local Tailwind concept"
kind = "app"
# Tailwind is listed after the React/Vite/TypeScript concepts because it expects
# those companions and contributes additive dependencies/files rather than
# overriding base React app files. Explicit order still documents priority.
concepts = [
  "react.app",
  "browser.spa",
  "vite.app",
  "typescript.app",
  "my-company.tailwind",
  "tspack.workspace",
  "tspack.manifestBoundary",
  "tspack.updatePolicy",
  "tspack.securityPolicy",
]

[generation]
manifest = "concept"

[variables.projectName]
default = "tailwind-react-app"

[variables.packageName]
default = "tailwind-react-app"

[variables.runtime]
default = "nodejs"
allowed = ["nodejs", "bun", "deno"]

[[files]]
from = "files/package.json.tmpl"
to = "package.json"

[[files]]
from = "files/tsconfig.tspack.json"
to = "tsconfig.tspack.json"

[[files]]
from = "files/vscode-settings.json"
to = ".vscode/settings.json"

[[files]]
from = "files/tsconfig.json"
to = "tsconfig.json"

[[files]]
from = "files/tspack-types/tspack-manifest.d.ts"
to = ".tspack/types/tspack-manifest.d.ts"

[[files]]
from = "files/tspack-types/tspack-xtest.d.ts"
to = ".tspack/types/tspack-xtest.d.ts"

[[files]]
from = "files/tspack-env.d.ts"
to = "tspack-env.d.ts"

[[files]]
from = "files/biome.json"
to = "biome.json"

[[files]]
from = "files/vite.config.ts"
to = "vite.config.ts"

[[files]]
from = "files/index.html.tmpl"
to = "index.html"

[[files]]
from = "files/src/main.tsx"
to = "src/main.tsx"

[[files]]
from = "files/src/App.tsx"
to = "src/App.tsx"

[[files]]
from = "files/README.md.tmpl"
to = "README.md"

[[localConcepts]]
name = "my-company.tailwind"
path = "concepts/tailwind.toml"
